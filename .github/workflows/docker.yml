name: ci
on:
  push:
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - id: dockermeta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/upsun/vinego
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/setup-buildx-action@v4
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PUBLISH_DEVREL }}
      - uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:src"
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.dockermeta.outputs.tags }}


  # Dependabot has no manager for these, so nothing else would notice them
  # drifting apart. Half-updated pins fail here and automerge leaves the PR.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - working-directory: src
        run: |
          set -uo pipefail
          fail=0
          bad() { echo "::error::$*"; fail=1; }

          cfg=$(sed -nE 's|^version: (v[0-9.]+)$|\1|p' .custom-gcl.yml | head -1)
          img=$(sed -nE 's|.*/golangci-lint@(v[0-9.]+)$|\1|p' Dockerfile | head -1)
          gomod=$(sed -nE 's|^go ([0-9]+\.[0-9]+).*|\1|p' go.mod | head -1)
          bases=$(sed -nE 's|^FROM golang:([^[:space:]]+).*|\1|p' Dockerfile | sort -u)

          for v in "$cfg" "$img" "$gomod" "$bases"; do
            [ -n "$v" ] || bad "a version pin could not be read from src/"
          done
          [ "$cfg" = "$img" ] || bad "golangci-lint: .custom-gcl.yml has $cfg, Dockerfile installs $img"
          [ "$(echo "$bases" | wc -l)" = 1 ] || bad "base images differ: $(echo $bases)"
          if [ "$fail" = 0 ] && [ "$(printf '%s\n%s\n' "$gomod" "${bases%%-*}" | sort -V | tail -1)" != "${bases%%-*}" ]; then
            bad "go.mod wants go $gomod but the base image is golang:${bases%%-*}"
          fi

          [ "$fail" = 0 ] && echo "pins consistent: golangci-lint $cfg, go $gomod on golang:$bases"
          exit "$fail"
