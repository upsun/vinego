name: ci
on:
  push:
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - id: dockermeta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/upsun/vinego
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/setup-buildx-action@v4
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PUBLISH_DEVREL }}
      - uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:src"
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.dockermeta.outputs.tags }}

  # The version pins Dependabot has no manager for. Failing here keeps a
  # half-updated set of pins from being merged by the automerge workflow.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version pins for drift
        run: |
          set -uo pipefail

          fail=0
          note() { echo "::error::$*"; echo "  DRIFT: $*" >&2; fail=1; }

          gcl_cfg="$(sed -nE 's|^version: (v[0-9]+\.[0-9]+\.[0-9]+)$|\1|p' src/.custom-gcl.yml | head -1)"
          gcl_img="$(sed -nE 's|^RUN go install github\.com/golangci/golangci-lint.*@(v[0-9]+\.[0-9]+\.[0-9]+)$|\1|p' src/Dockerfile | head -1)"
          go_mod="$(sed -nE 's|^go ([0-9]+\.[0-9]+).*$|\1|p' src/go.mod | head -1)"
          mapfile -t images < <(sed -nE 's|^FROM golang:([0-9]+\.[0-9]+[^[:space:]]*).*$|\1|p' src/Dockerfile)

          [ -n "$gcl_cfg" ] || note "no 'version: vX.Y.Z' in src/.custom-gcl.yml"
          [ -n "$gcl_img" ] || note "no 'go install .../golangci-lint@vX.Y.Z' in src/Dockerfile"
          [ -n "$go_mod" ]  || note "no 'go X.Y' directive in src/go.mod"
          [ "${#images[@]}" -gt 0 ] || note "no 'FROM golang:X.Y' in src/Dockerfile"

          if [ -n "$gcl_cfg" ] && [ -n "$gcl_img" ] && [ "$gcl_cfg" != "$gcl_img" ]; then
            note "golangci-lint: .custom-gcl.yml says $gcl_cfg but Dockerfile installs $gcl_img"
          fi

          if [ "${#images[@]}" -gt 0 ]; then
            first="${images[0]}"
            for img in "${images[@]}"; do
              [ "$img" = "$first" ] || note "base images differ: golang:$first vs golang:$img"
            done
            img_minor="${first%%-*}"
            if [ -n "$go_mod" ] && [ "$(printf '%s\n%s\n' "$go_mod" "$img_minor" | sort -V | tail -1)" != "$img_minor" ]; then
              note "src/go.mod needs go $go_mod but the base image is only golang:$img_minor"
            fi
          fi

          if [ "$fail" -eq 0 ]; then
            echo "pins consistent: golangci-lint $gcl_cfg, go $go_mod on golang:${images[0]}"
          fi
          exit "$fail"
