name: sync-pins

# The pins Dependabot has no manager for: the golangci-lint version, which
# lives in both src/.custom-gcl.yml and src/Dockerfile and must agree, and the
# go directive in src/go.mod, which otherwise never follows the base image that
# Dependabot does bump. Raises a pull request so the change goes through ci and
# automerge exactly like a Dependabot one.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  push:
    branches: [main]
    paths:
      - src/Dockerfile
      - src/go.mod
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PUBLISH_DEVREL }}

      - id: sync
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLISH_DEVREL }}
        run: |
          set -euo pipefail

          # golangci-lint, written to both places in one go. The module path
          # carries the major version, so a v2 -> v3 release moves that too; if
          # upstream breaks the plugin API, ci fails and the PR stays open.
          tag="$(gh api repos/golangci/golangci-lint/releases/latest --jq .tag_name)"
          major="${tag#v}"
          major="${major%%.*}"
          module="github.com/golangci/golangci-lint"
          if [ "$major" -gt 1 ]; then
            module="${module}/v${major}"
          fi
          sed -i -E "s|^version: v?[0-9].*$|version: ${tag}|" src/.custom-gcl.yml
          sed -i -E "s|^RUN go install github\.com/golangci/golangci-lint.*$|RUN go install ${module}/cmd/golangci-lint@${tag}|" src/Dockerfile

          # The go directive follows whatever base image is pinned today.
          image="$(sed -nE 's|^FROM golang:([0-9]+\.[0-9]+).*$|\1|p' src/Dockerfile | head -1)"
          sed -i -E "s|^go [0-9]+\.[0-9]+(\.[0-9]+)?$|go ${image}|" src/go.mod

          if git diff --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Pins already in sync (golangci-lint ${tag}, go ${image})."
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          git --no-pager diff --stat

      - if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLISH_DEVREL }}
        run: |
          set -euo pipefail
          branch=automated/sync-pins

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: sync golangci-lint version and go directive"
          git push --force origin "$branch"

          open="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: sync golangci-lint version and go directive" \
              --body "Version pins Dependabot has no manager for. Raised by the sync-pins workflow; merges itself once ci is green."
          else
            echo "Updated existing #${open}."
          fi
